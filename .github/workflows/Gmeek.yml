name: Gmeek

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gmeek
        uses: Meekdai/Gmeek@main
        with:
          GMEEK_VERSION: last
